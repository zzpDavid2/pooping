name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 类型检查 + 构建
        run: pnpm build

      # CLAUDE.md 3.3：零外部 CDN 是铁律，必须在 CI 里挡住
      - name: 零外部 CDN 检查
        run: pnpm check:external
