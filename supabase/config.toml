project_id = "pooping"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

# V1 只做匿名登录（CLAUDE.md 第 5 节）。打开即用，没有注册流程。
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

# 不接 Google / Apple 登录 —— 国内直接死（CLAUDE.md 8.1）

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.generate-review]
# 函数内部自己校验 JWT，还要放行 service_role 给 seed 脚本用
verify_jwt = false
